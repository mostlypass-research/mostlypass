name: 1-daily-research
on:
  schedule:
    - cron: "15 12 * * *"      # 08:15 ET (EDT) / 07:15 ET (EST): morning research package
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: approval label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create approval --color 1d4ed8 --description "Daily research awaiting approval" --force --repo ${{ github.repository }}
      - name: run the daily pipeline (LIVE)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_daily.py
      - name: commit (append-only data) and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database content/out models
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "daily research: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push --quiet && exit 0; sleep $((i*7)); done
          echo "push failed after retries"; exit 1
