name: 4-publish-on-approve
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      date:
        description: "Package date to publish (YYYY-MM-DD). Leave empty to only rebuild the website."
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'approval') &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, 'approve'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      INPUT_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: publish (record + site); refuses fixture, stale or unvalidated packages
        run: |
          D="$INPUT_DATE"
          if [ -z "$D" ] && [ -n "$ISSUE_TITLE" ]; then D=$(echo "$ISSUE_TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1); fi
          if [ -z "$D" ]; then python run_publish.py --site-only; else python run_publish.py --date "$D"; fi
      - name: commit (append-only data) and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database content/out
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push --quiet && exit 0; sleep $((i*7)); done
          echo "push failed after retries"; exit 1
      - name: deploy website (Cloudflare Pages)
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT=$(python -c "import yaml;print(yaml.safe_load(open('config/settings.yaml'))['brand']['pages_project'])")
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site/public --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: close the approval issue
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} -c "Published. Website updated."
