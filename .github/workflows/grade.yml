name: 3-grade-and-site
on:
  schedule:
    - cron: "0 11 * * *"       # 07:00 ET: grade finished games, refresh record + site
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: grade + rebuild site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_grade.py
      - name: commit (append-only data) and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "grading: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push --quiet && exit 0; sleep $((i*7)); done
          echo "push failed after retries"; exit 1
      - name: deploy website (Cloudflare Pages)
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT=$(python -c "import yaml;print(yaml.safe_load(open('config/settings.yaml'))['brand']['pages_project'])")
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site/public --project-name "$PROJECT" --branch main --commit-dirty=true
